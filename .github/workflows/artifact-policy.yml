name: Check artifact storage policy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/r2-artifacts.mjs', 'scripts/check-artifact-storage.mjs', 'ARTIFACT-STORAGE.md']
  pull_request:
    paths: ['.github/workflows/**', 'scripts/r2-artifacts.mjs', 'scripts/check-artifact-storage.mjs', 'ARTIFACT-STORAGE.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-artifact-storage.mjs
